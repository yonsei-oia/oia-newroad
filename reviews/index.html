<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A1A38">
<title>교환학생 후기모음 · 연세대학교 국제처</title>
<meta name="description" content="연세대학교 국제처 · 새로운 길 — 먼저 다녀온 학생들이 남긴 교환학생 경험보고서를 읽는 곳. 곧 문을 엽니다.">
<meta property="og:title" content="교환학생 후기모음 · 연세대학교 국제처">
<meta property="og:description" content="먼저 그 길을 걸은 사람들이 남긴 기록. 곧 문을 엽니다.">
<meta property="og:url" content="https://exchange.yonsei.ac.kr/reviews/">
<meta property="og:image" content="https://exchange.yonsei.ac.kr/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --paper: #FBFAF7; --ink: #10254B; --text-sub: #56657F; --text-faint: #66728A;
    --gold-night: #F3D488; --gold-small: #8A6A1E; --header-sub: #C7B48C; --rule: #E8E2D5;
    --font-serif: 'Gowun Batang', serif;
    --font-sans: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body {
    min-height: 100vh; font-family: var(--font-sans); color: var(--text-sub);
    background: var(--paper); -webkit-font-smoothing: antialiased;
  }
  /* 밤에서 새벽으로. 띠 안에서만 그라데이션이 끝나고, 본문은 종이 위에 앉는다 —
     페이지 전체에 깔면 본문 글자가 어두운 구간에 걸려 읽히지 않는다(실측). */
  .band { background: linear-gradient(180deg, #0A1A38 0%, #142C54 32%, #2E4874 58%, #4A5878 76%, #8C8680 90%, #FBFAF7 100%); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 20px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 0; }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .title { font-family: var(--font-serif); font-size: 13px; font-weight: 700; color: #F2F6FF; }
  .sub { font-size: 9px; color: var(--header-sub); letter-spacing: 0.04em; }
  .switch { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .switch span, .switch a {
    display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px;
    border-radius: 999px; font-size: 10.5px; line-height: 1; white-space: nowrap;
  }
  .switch span { color: var(--gold-night); font-weight: 700; border: 1px solid currentColor; }
  .switch a { color: var(--header-sub); text-decoration: none; border: 1px solid transparent; }
  .switch a:hover, .switch a:focus-visible { color: var(--gold-night); text-decoration: underline; text-underline-offset: 3px; }
  .verse { margin: 44px 0 0; padding-bottom: 0; font-family: var(--font-serif); font-size: 26px; font-weight: 700; line-height: 1.58; letter-spacing: -0.035em; color: #F2F6FF; word-break: keep-all; }
  .byline { display: flex; align-items: center; gap: 8px; margin: 18px 0 0; padding-bottom: 96px; font-size: 10px; color: #F5EBD6; }
  .byline i { display: block; width: 18px; height: 1px; background: var(--gold-night); }
  .card { padding: 34px 0 48px; }
  .lead { margin: 0; font-family: var(--font-serif); font-size: 19px; line-height: 1.62; letter-spacing: -0.03em; color: var(--ink); word-break: keep-all; }
  .body { margin: 14px 0 0; font-size: 13.5px; line-height: 1.8; color: var(--text-sub); word-break: keep-all; }
  .rule { margin: 26px 0; height: 1px; background: var(--rule); }
  .back { display: inline-flex; align-items: center; min-height: 24px; font-size: 13px; font-weight: 700; color: var(--gold-small); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .credit { margin: 30px 0 0; font-size: 10.5px; line-height: 1.7; color: var(--text-faint); word-break: keep-all; }
</style>
</head>
<body>
  <div class="band">
    <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="title">교환학생 후기모음</span>
        <span class="sub">연세대학교 국제처 · 새로운 길</span>
      </div>
      <nav class="switch" aria-label="서비스">
        <span aria-current="page">후기모음</span>
        <a href="/">동행 찾기</a>
      </nav>
    </header>

    <p class="verse">내를 건너서 숲으로<br>고개를 넘어서 마을로</p>
    <p class="byline"><i></i>윤동주, 「새로운 길」</p>
    </div>
  </div>

  <div class="wrap">
    <main class="card">
      <h1 class="lead">먼저 그 길을 걸은 사람들이<br>남긴 기록입니다.</h1>
      <p class="body">
        1997년부터 쌓인 교환학생 경험보고서를 대학별로 모아 읽을 수 있게 준비하고 있습니다.
        곧 이 자리에서 문을 엽니다.
      </p>
      <div class="rule"></div>
      <p class="body" style="margin-top:0">
        파견이 확정되어 같은 기수 동행을 찾고 계신다면, 지금은 새로운 길에서 만나실 수 있습니다.
      </p>
      <a class="back" href="/">새로운 길로 가기</a>
      <p class="credit">© 2026 연세대학교 국제처 · 설계·개발 최서아 Seo-Ah Choi</p>
    </main>
  </div>
</body>
</html>
