<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>새로운 길: 연세대학교 해외파견 동행 프로젝트</title>
  <meta name="description" content="연세대학교 국제처 해외파견 프로그램 동행 프로젝트 — 새로운 길">
  <link rel="icon" href="/yonsei-symbol.png">
  <!-- 링크 미리보기(카카오톡·SNS) Open Graph. og.jpg(1200x630 배너, 언더우드관). -->
  <!-- 정식 도메인 exchange.yonsei.ac.kr 연결 완료(2026-07-28). og:url/og:image는 exchange 절대경로. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://exchange.yonsei.ac.kr">
  <meta property="og:title" content="새로운 길 · 연세대학교 해외파견 동행 프로젝트">
  <meta property="og:description" content="파견확정 학생들이 같은 대학·국가·대륙으로 떠나는 동행을 찾는 곳. 연세대학교 국제처.">
  <meta property="og:image" content="https://exchange.yonsei.ac.kr/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body { margin: 0; height: 100%; background: #003976; overflow: hidden; }
    #frame { border: 0; width: 100%; height: 100%; display: block; }
    #load {
      position: fixed; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: radial-gradient(ellipse 120% 95% at 50% -12%, #003976 0%, #05285a 38%, #0a1a38 100%);
      transition: opacity .45s ease;
    }
    /* 언어중립 로딩 — 별빛 점 3개(문구 없음, 수정 불필요) */
    #load span { width: 7px; height: 7px; border-radius: 50%; background: #f3d488; opacity: .35; animation: nlpulse 1.2s ease-in-out infinite; }
    #load span:nth-child(2) { animation-delay: .2s; }
    #load span:nth-child(3) { animation-delay: .4s; }
    @keyframes nlpulse { 0%, 100% { opacity: .3; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="load"><span></span><span></span><span></span></div>
  <!-- GAS 웹앱 공개(/macros/s/) /exec URL. 배포 "새 버전"으로 갱신하면 이 URL은 고정. -->
  <iframe id="frame"
    src="https://script.google.com/macros/s/AKfycbxvZ6Uz_8B3BNCfHyK1AR43Req2zrHR6GPO937SRxLXR-77fz-DmdkBTB0rzxicR-FQ/exec"
    allow="clipboard-write"
    referrerpolicy="no-referrer"
    onload="var l=document.getElementById('load'); if(l){ l.style.opacity='0'; setTimeout(function(){ l.style.display='none'; }, 450); }"></iframe>
</body>
</html>
